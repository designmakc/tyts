# Every push and pull request: the tests, the typecheck, the build and the installer on Windows,
# where Tyts runs (the engine's tests on its core part; the installer kept 7 days as an artifact), and the Mac dmg on Apple
# silicon, as release.yml makes it, so a tag never finds the Mac build broken. A read-only token:
# the steps run code from npm and PyPI. Actions pinned by commit, as in release.yml.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.13.0'
      - run: uv sync --frozen --group dev
        working-directory: engine
      - run: npm run test:engine
      # The installer of this very commit, to try a branch live before it is merged: Actions › the run › Artifacts › installer.
      - run: npm run dist -- --publish never
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer
          path: release/Tyts-Setup-*.exe
          if-no-files-found: error
          retention-days: 7

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:mac -- --publish never
